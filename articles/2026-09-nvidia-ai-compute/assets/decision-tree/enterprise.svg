<svg xmlns="http://www.w3.org/2000/svg" width="652" height="1560" viewBox="0 0 652 1560"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#629779"/></marker></defs><rect width="100%" height="100%" fill="#f8fbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g transform="translate(16,16)"><rect width="620" height="80" rx="8" fill="#17633f"/><text x="310" y="32" text-anchor="middle" fill="white" font-size="26" font-weight="600"><tspan x="310" dy="0">企业专业团队</tspan></text><text x="310" y="61" text-anchor="middle" fill="#dfefe4" font-size="17" font-weight="400"><tspan x="310" dy="0">范围：专业设计与 AI 应用</tspan></text><path d="M205,123.0 L330.0,180 L205,237.0 L80.0,180 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="173" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">当前主要任务</tspan><tspan x="205" dy="28.0">是专业设计？</tspan></text><path d="M330,180 L405,180" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="150" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="170" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="126.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="159" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">按专业应用配置电脑</tspan><tspan x="505" dy="26.599999999999998">RTX PRO 是一种选择</tspan><tspan x="505" dy="26.599999999999998">关注项目与稳定性要求</tspan></text><path d="M205,237 L205,323" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="265.0" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="285.0" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><path d="M205,323.0 L330.0,380 L205,437.0 L80.0,380 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="373" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">现成 AI 应用</tspan><tspan x="205" dy="28.0">能满足业务需要？</tspan></text><path d="M330,380 L405,380" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="350" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="370" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="326.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="359" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">使用现成应用</tspan><tspan x="505" dy="26.599999999999998">配置资料与业务流程</tspan><tspan x="505" dy="26.599999999999998">对接系统并测试效果</tspan></text><path d="M205,437 L205,523" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="465.0" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="485.0" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><path d="M205,523.0 L330.0,580 L205,637.0 L80.0,580 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="573" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">自行开发时，需要</tspan><tspan x="205" dy="28.0">自己部署模型吗？</tspan></text><path d="M330,580 L405,580" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="550" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="570" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">否</tspan></text><rect x="405.0" y="526.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="559" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">调用模型 API</tspan><tspan x="505" dy="26.599999999999998">服务商负责运行模型</tspan><tspan x="505" dy="26.599999999999998">企业连接业务与应用</tspan></text><path d="M205,637 L205,723" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="665.0" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="685.0" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">是</tspan></text><path d="M205,723.0 L330.0,780 L205,837.0 L80.0,780 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="773" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">已有适合部署的</tspan><tspan x="205" dy="28.0">自有计算设备？</tspan></text><path d="M330,780 L405,780" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="750" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="770" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="726.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="759" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">可在自有设备部署</tspan><tspan x="505" dy="26.599999999999998">专业电脑或服务器等</tspan><tspan x="505" dy="26.599999999999998">按实际模型测试</tspan></text><path d="M205,837 L205,900" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="854" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="874" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><rect x="70.0" y="900.0" width="270" height="106" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="205" y="946" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="205" dy="0">租用云端算力</tspan><tspan x="205" dy="26.599999999999998">或购置合适设备</tspan></text><path d="M505,834 L505,1045 L205,1045 L205,1103" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M205,1006 L205,1103" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M205,1103.0 L330.0,1160 L205,1217.0 L80.0,1160 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="1153" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">模型需要训练</tspan><tspan x="205" dy="28.0">或微调吗？</tspan></text><path d="M330,1160 L405,1160" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="1130" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="1150" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="1106.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="1139" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">选用开发与训练工具</tspan><tspan x="505" dy="26.599999999999998">NeMo 是一种选择</tspan><tspan x="505" dy="26.599999999999998">可微调受支持模型</tspan></text><path d="M205,1217 L205,1335" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="1255" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="1275" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><path d="M505,1214 L505,1310 L205,1310 L205,1335" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45.0" y="1335.0" width="320" height="150" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="205" y="1375" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="205" dy="0">部署推理并接入应用</tspan><tspan x="205" dy="26.599999999999998">CUDA 可支撑训练与推理</tspan><tspan x="205" dy="26.599999999999998">TensorRT、NIM 等按需选用</tspan><tspan x="205" dy="26.599999999999998">也可采用其他适配工具</tspan></text></g><text x="326" y="1544" text-anchor="middle" fill="#687f6b" font-size="16" font-weight="400"><tspan x="326" dy="0">是／否表示当前任务条件；示例产品均非唯一方案。</tspan></text></g></svg>