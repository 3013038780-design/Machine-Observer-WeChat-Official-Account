<svg xmlns="http://www.w3.org/2000/svg" width="652" height="1290" viewBox="0 0 652 1290"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#629779"/></marker></defs><rect width="100%" height="100%" fill="#f8fbf8"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g transform="translate(16,16)"><rect width="620" height="80" rx="8" fill="#17633f"/><text x="310" y="32" text-anchor="middle" fill="white" font-size="26" font-weight="600"><tspan x="310" dy="0">云厂商与算力运营商</tspan></text><text x="310" y="61" text-anchor="middle" fill="#dfefe4" font-size="17" font-weight="400"><tspan x="310" dy="0">范围：组织资源，提供计算服务</tspan></text><path d="M205,123.0 L330.0,180 L205,237.0 L80.0,180 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="173" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">单台设备能满足</tspan><tspan x="205" dy="28.0">当前计算需求？</tspan></text><path d="M330,180 L405,180" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="150" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="170" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="126.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="159" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">先采用单机方案</tspan><tspan x="505" dy="26.599999999999998">CPU、GPU、内存</tspan><tspan x="505" dy="26.599999999999998">与存储共同工作</tspan></text><path d="M205,237 L205,323" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="265.0" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="285.0" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><path d="M205,323.0 L330.0,380 L205,437.0 L80.0,380 Z" fill="#e5f0e6" stroke="#17633f" stroke-width="2"/><text x="205" y="373" text-anchor="middle" fill="#244a33" font-size="20" font-weight="500"><tspan x="205" dy="0">单个模型需要</tspan><tspan x="205" dy="28.0">跨多个 GPU 运行？</tspan></text><path d="M330,380 L405,380" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="349" y="350" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="370" y="370" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="370" dy="0">是</tspan></text><rect x="405.0" y="326.0" width="200" height="108" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="505" y="359" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="505" dy="0">模型或计算任务拆分</tspan><tspan x="505" dy="26.599999999999998">需要 GPU 间通信</tspan><tspan x="505" dy="26.599999999999998">NVLink 等互连能力</tspan></text><path d="M205,437 L205,502" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="205" y="460" width="42" height="29" rx="4" fill="#f8fbf8"/><text x="226" y="480" text-anchor="middle" fill="#17633f" font-size="18" font-weight="600"><tspan x="226" dy="0">否</tspan></text><rect x="70.0" y="502.0" width="270" height="114" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="205" y="552" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="205" dy="0">可增加模型副本</tspan><tspan x="205" dy="26.599999999999998">把请求分给不同设备</tspan></text><path d="M505,434 L505,671 L205,671 L205,722" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M205,616 L205,722" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="55.0" y="722.0" width="300" height="156" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="205" y="765" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="205" dy="0">多设备组织与通信</tspan><tspan x="205" dy="26.599999999999998">HGX：多 GPU 平台</tspan><tspan x="205" dy="26.599999999999998">MGX：参考架构</tspan><tspan x="205" dy="26.599999999999998">DGX：系统家族</tspan></text><text x="450" y="930" text-anchor="middle" fill="#687f6b" font-size="17" font-weight="400"><tspan x="450" dy="0">两种扩展方法</tspan><tspan x="450" dy="23.799999999999997">也可以结合使用</tspan></text><path d="M205,878 L205,1030" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M605,180 L613,180 L613,1000 L205,1000 L205,1030" fill="none" stroke="#629779" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45.0" y="1030.0" width="320" height="180" rx="8" fill="white" stroke="#8eb49a" stroke-width="2"/><text x="205" y="1085" text-anchor="middle" fill="#244a33" font-size="19" font-weight="400"><tspan x="205" dy="0">持续运行与服务保障</tspan><tspan x="205" dy="26.599999999999998">调度 · 监测 · 故障恢复</tspan><tspan x="205" dy="26.599999999999998">按用量调整资源</tspan><tspan x="205" dy="26.599999999999998">兼顾响应速度与利用率</tspan></text></g><text x="326" y="1274" text-anchor="middle" fill="#687f6b" font-size="16" font-weight="400"><tspan x="326" dy="0">是／否表示当前任务条件；示例产品均非唯一方案。</tspan></text></g></svg>