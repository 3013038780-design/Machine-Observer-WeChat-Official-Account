<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1410" viewBox="0 0 720 1410"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#17633F" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="1410" rx="0" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="2"/><rect x="28" y="28" width="70" height="42" rx="6" fill="#17633F" stroke="none" stroke-width="2"/><text x="63" y="58" font-size="27" fill="white" font-weight="600" text-anchor="middle">06</text><text x="117" y="61" font-size="25" fill="#557366" font-weight="400" text-anchor="start">旁观机器 · 图解</text><text x="32" y="119" font-size="38" fill="#17633F" font-weight="600" text-anchor="start">英伟达产品，放回系统里看</text><text x="32" y="164" font-size="28" fill="#557366" font-weight="400" text-anchor="start">先分清设备运行与研发工具，再看采用范围</text><rect x="32" y="202" width="656" height="59" rx="16" fill="#17633F" stroke="none" stroke-width="2"/><text x="54" y="243" font-size="31" fill="white" font-weight="600" text-anchor="start">汽车：计算硬件与驾驶软件</text><text x="54" y="314" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">DRIVE Orin / Thor</text><text x="54" y="362" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">车载计算：运行相应程序</text><path d="M54 388 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="437" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">DriveOS</text><text x="54" y="485" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">基础软件：支持程序使用硬件</text><path d="M54 511 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="560" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">DRIVE AV</text><text x="54" y="608" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">驾驶软件：提供相应驾驶功能</text><path d="M54 634 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="665" width="656" height="59" rx="16" fill="#17633F" stroke="none" stroke-width="2"/><text x="54" y="706" font-size="31" fill="white" font-weight="600" text-anchor="start">机器人：设备端与研发端</text><text x="54" y="782" font-size="31" fill="#17633F" font-weight="600" text-anchor="start">Jetson → 设备端计算</text><text x="54" y="830" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">计算模块，需集成到完整机器</text><path d="M54 856 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="905" font-size="31" fill="#17633F" font-weight="600" text-anchor="start">Isaac Sim / Lab → 研发</text><text x="54" y="953" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">模拟环境、学习与评估工具</text><path d="M54 979 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="1028" font-size="31" fill="#17633F" font-weight="600" text-anchor="start">Isaac ROS → 应用开发</text><text x="54" y="1076" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">加速软件包，支持部分感知等功能</text><path d="M54 1102 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="1151" font-size="31" fill="#17633F" font-weight="600" text-anchor="start">GR00T → 模型资源</text><text x="54" y="1199" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">需要按任务与机器结构进行适配</text><path d="M54 1225 H666" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1309" font-size="28" fill="#17633F" font-weight="600" text-anchor="start">可按需要组合，不代表必须全部购买或采用。</text><path d="M32 1334 H688" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1371" font-size="24" fill="#557366" font-weight="400" text-anchor="start">此处列示产品角色；具体支持范围按版本确认。</text></g></svg>