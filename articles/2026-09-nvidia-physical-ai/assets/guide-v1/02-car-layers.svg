<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#17633F" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="1190" rx="0" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="2"/><rect x="28" y="28" width="70" height="42" rx="6" fill="#17633F" stroke="none" stroke-width="2"/><text x="63" y="58" font-size="27" fill="white" font-weight="600" text-anchor="middle">02</text><text x="117" y="61" font-size="25" fill="#557366" font-weight="400" text-anchor="start">旁观机器 · 图解</text><text x="32" y="119" font-size="38" fill="#17633F" font-weight="600" text-anchor="start">一辆车，不只一颗芯片</text><text x="32" y="164" font-size="28" fill="#557366" font-weight="400" text-anchor="start">系统组成可以由不同企业共同提供</text><rect x="32" y="200" width="656" height="188" rx="16" fill="white" stroke="#D5E5DA" stroke-width="2"/><text x="56" y="245" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">传感器</text><text x="56" y="296" font-size="30" fill="#263A31" font-weight="400" text-anchor="start">摄像头、雷达等：采集信息</text><text x="56" y="347" font-size="28" fill="#557366" font-weight="400" text-anchor="start">车企选择并集成不同供应商的设备</text><rect x="32" y="407" width="656" height="188" rx="16" fill="white" stroke="#D5E5DA" stroke-width="2"/><text x="56" y="452" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">计算硬件</text><text x="56" y="503" font-size="30" fill="#263A31" font-weight="400" text-anchor="start">运行程序，处理传感器数据</text><text x="56" y="554" font-size="28" fill="#557366" font-weight="400" text-anchor="start">可采用供应商芯片，也可自研芯片</text><rect x="32" y="614" width="656" height="188" rx="16" fill="white" stroke="#D5E5DA" stroke-width="2"/><text x="56" y="659" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">驾驶软件</text><text x="56" y="710" font-size="30" fill="#263A31" font-weight="400" text-anchor="start">识别环境、规划行动</text><text x="56" y="761" font-size="28" fill="#557366" font-weight="400" text-anchor="start">可自研、外购，或与伙伴联合开发</text><rect x="32" y="821" width="656" height="188" rx="16" fill="white" stroke="#D5E5DA" stroke-width="2"/><text x="56" y="866" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">车辆控制与执行</text><text x="56" y="917" font-size="30" fill="#263A31" font-weight="400" text-anchor="start">把计划落实为转向、制动等动作</text><text x="56" y="968" font-size="28" fill="#557366" font-weight="400" text-anchor="start">需要与整车机械、电子系统配合</text><rect x="32" y="1046" width="656" height="57" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="360" y="1084" font-size="29" fill="#17633F" font-weight="600" text-anchor="middle">采用英伟达芯片 ≠ 采用整套驾驶软件</text><path d="M32 1114 H688" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1151" font-size="24" fill="#557366" font-weight="400" text-anchor="start">这是组成关系，不是四件产品的购买顺序。</text></g></svg>