<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#17633F" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="1220" rx="0" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="2"/><rect x="28" y="28" width="70" height="42" rx="6" fill="#17633F" stroke="none" stroke-width="2"/><text x="63" y="58" font-size="27" fill="white" font-weight="600" text-anchor="middle">01</text><text x="117" y="61" font-size="25" fill="#557366" font-weight="400" text-anchor="start">旁观机器 · 图解</text><text x="32" y="119" font-size="38" fill="#17633F" font-weight="600" text-anchor="start">一次辅助减速，怎样发生</text><text x="32" y="164" font-size="28" fill="#557366" font-weight="400" text-anchor="start">从观察到执行，系统持续获取反馈</text><rect x="32" y="200" width="656" height="198" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><circle cx="64" cy="238" r="20" fill="#17633F"/><text x="64" y="247" font-size="25" fill="white" font-weight="600" text-anchor="middle">1</text><text x="100" y="249" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">前车减速</text><g transform="translate(80 282) scale(0.65)"><rect x="0" y="27" width="142" height="48" rx="12" fill="white" stroke="#17633F" stroke-width="2"/><path d="M 25 27 L 42 0 H 100 L 121 27" fill="none" stroke="#17633F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 53 7 V 25 M 90 7 V 25" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="76" r="13" fill="#17633F"/><circle cx="111" cy="76" r="13" fill="#17633F"/></g><g transform="translate(360 282) scale(0.65)"><rect x="0" y="27" width="142" height="48" rx="12" fill="white" stroke="#BC783D" stroke-width="2"/><path d="M 25 27 L 42 0 H 100 L 121 27" fill="none" stroke="#BC783D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 53 7 V 25 M 90 7 V 25" fill="none" stroke="#BC783D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="76" r="13" fill="#BC783D"/><circle cx="111" cy="76" r="13" fill="#BC783D"/></g><text x="506" y="327" font-size="30" fill="#BC783D" font-weight="400" text-anchor="start">减速</text><path d="M360 403 v 19" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="428" width="656" height="198" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><circle cx="64" cy="466" r="20" fill="#17633F"/><text x="64" y="475" font-size="25" fill="white" font-weight="600" text-anchor="middle">2</text><text x="100" y="477" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">获取信息</text><rect x="74" y="514" width="76" height="48" rx="6" fill="white" stroke="#17633F" stroke-width="2"/><circle cx="112" cy="538" r="15" fill="#17633F"/><path d="M 166 538 L 270 510 M166 538 L270 569" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="551" font-size="30" fill="#263A31" font-weight="400" text-anchor="start">图像、距离等数据</text><path d="M360 631 v 19" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="656" width="656" height="198" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><circle cx="64" cy="694" r="20" fill="#17633F"/><text x="64" y="703" font-size="25" fill="white" font-weight="600" text-anchor="middle">3</text><text x="100" y="705" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">计算怎样减速</text><rect x="66" y="744" width="94" height="78" rx="9" fill="white" stroke="#17633F" stroke-width="2"/><rect x="87" y="762" width="52" height="42" rx="3" fill="#F2F7F3" stroke="#17633F" stroke-width="2"/><path d="M 78 736 v 8 M 78 822 v 8" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 96 736 v 8 M 96 822 v 8" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 114 736 v 8 M 114 822 v 8" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 132 736 v 8 M 132 822 v 8" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 150 736 v 8 M 150 822 v 8" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="769" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">识别前车 → 安排行动</text><text x="190" y="812" font-size="28" fill="#557366" font-weight="400" text-anchor="start">信息在这里变成操作计划</text><path d="M360 859 v 19" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="884" width="656" height="198" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><circle cx="64" cy="922" r="20" fill="#17633F"/><text x="64" y="931" font-size="25" fill="white" font-weight="600" text-anchor="middle">4</text><text x="100" y="933" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">车辆执行并继续观察</text><text x="60" y="987" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">制动系统执行，系统重新观察距离，</text><text x="60" y="1033" font-size="29" fill="#263A31" font-weight="400" text-anchor="start">根据变化调整后续动作。</text><text x="32" y="1123" font-size="27" fill="#557366" font-weight="400" text-anchor="start">这是一种功能示意，不代表具体车型配置。</text><path d="M32 1144 H688" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1181" font-size="24" fill="#557366" font-weight="400" text-anchor="start">箭头表示处理过程；下一轮会继续观察道路。</text></g></svg>