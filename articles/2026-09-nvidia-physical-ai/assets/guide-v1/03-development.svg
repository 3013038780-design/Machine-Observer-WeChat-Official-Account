<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#17633F" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="1280" rx="0" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="2"/><rect x="28" y="28" width="70" height="42" rx="6" fill="#17633F" stroke="none" stroke-width="2"/><text x="63" y="58" font-size="27" fill="white" font-weight="600" text-anchor="middle">03</text><text x="117" y="61" font-size="25" fill="#557366" font-weight="400" text-anchor="start">旁观机器 · 图解</text><text x="32" y="119" font-size="38" fill="#17633F" font-weight="600" text-anchor="start">一项驾驶功能，从研发到上车</text><text x="32" y="164" font-size="28" fill="#557366" font-weight="400" text-anchor="start">研发设备与车载设备，承担不同工作</text><rect x="64" y="204" width="608" height="140" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="88" y="252" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">明确任务条件</text><text x="88" y="303" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">在哪些道路、天气下使用？</text><path d="M368 352 v16" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="64" y="376" width="608" height="140" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="88" y="424" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">准备数据与开发软件</text><text x="88" y="475" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">整理道路记录，训练模型或编写程序</text><path d="M368 524 v16" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="64" y="548" width="608" height="140" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="88" y="596" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">在研发环境中验证</text><text x="88" y="647" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">记录数据测试、模拟交通、连接真实硬件</text><path d="M368 696 v16" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="64" y="720" width="608" height="140" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="88" y="768" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">在车辆上测试</text><text x="88" y="819" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">结合封闭场地和实际道路检查系统</text><path d="M368 868 v16" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="64" y="892" width="608" height="140" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><text x="88" y="940" font-size="32" fill="#17633F" font-weight="600" text-anchor="start">投入使用与持续改进</text><text x="88" y="991" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">验证软件更新，分析异常与反馈</text><path d="M57 1048 H25 V240 H55" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="64" y="1110" font-size="28" fill="#557366" font-weight="400" text-anchor="start">发现问题，会回到相应环节继续修改。</text><text x="64" y="1154" font-size="28" fill="#17633F" font-weight="400" text-anchor="start">训练可用本地或云端；运行须适配车辆。</text><path d="M32 1204 H688" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1241" font-size="24" fill="#557366" font-weight="400" text-anchor="start">流程用于理解；实际开发会反复迭代、交叉进行。</text></g></svg>