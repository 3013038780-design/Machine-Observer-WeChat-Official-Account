<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1200" viewBox="0 0 720 1200"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#17633F" stroke-width="1.5"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="1200" rx="0" fill="#FFFFFF" stroke="#D5E5DA" stroke-width="2"/><rect x="28" y="28" width="70" height="42" rx="6" fill="#17633F" stroke="none" stroke-width="2"/><text x="63" y="58" font-size="27" fill="white" font-weight="600" text-anchor="middle">05</text><text x="117" y="61" font-size="25" fill="#557366" font-weight="400" text-anchor="start">旁观机器 · 图解</text><text x="32" y="119" font-size="38" fill="#17633F" font-weight="600" text-anchor="start">机器人拿起一个零件</text><text x="32" y="164" font-size="28" fill="#557366" font-weight="400" text-anchor="start">看见、规划、执行与反馈共同完成动作</text><rect x="32" y="200" width="656" height="203" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><rect x="70" y="322" width="60" height="18" rx="3" fill="#17633F" stroke="none" stroke-width="2"/><path d="M 98 324 L 100 278 L 154 246 L 184 286" fill="none" stroke="#17633F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98" cy="324" r="9" fill="white"/><circle cx="98" cy="324" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="100" cy="278" r="9" fill="white"/><circle cx="100" cy="278" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="154" cy="246" r="9" fill="white"/><circle cx="154" cy="246" r="9" fill="none" stroke="#17633F" stroke-width="4"/><path d="M 172 286 v 21 h 8 M 196 286 v 21 h -8" fill="none" stroke="#17633F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="224" y="346" width="29" height="27" rx="3" fill="#BC783D" stroke="none" stroke-width="2"/><path d="M61 375 H270" fill="none" stroke="#D5E5DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="254" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">找到零件</text><text x="310" y="309" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">摄像头提供图像，</text><text x="310" y="352" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">软件确定目标位置。</text><path d="M360 408 v10" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="425" width="656" height="203" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><rect x="70" y="547" width="60" height="18" rx="3" fill="#17633F" stroke="none" stroke-width="2"/><path d="M 98 549 L 100 503 L 154 471 L 184 511" fill="none" stroke="#17633F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98" cy="549" r="9" fill="white"/><circle cx="98" cy="549" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="100" cy="503" r="9" fill="white"/><circle cx="100" cy="503" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="154" cy="471" r="9" fill="white"/><circle cx="154" cy="471" r="9" fill="none" stroke="#17633F" stroke-width="4"/><path d="M 172 511 v 21 h 8 M 196 511 v 21 h -8" fill="none" stroke="#17633F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="224" y="571" width="29" height="27" rx="3" fill="#BC783D" stroke="none" stroke-width="2"/><path d="M61 600 H270" fill="none" stroke="#D5E5DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="479" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">安排动作</text><text x="310" y="534" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">规划机械臂路径，</text><text x="310" y="577" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">考虑障碍与可达范围。</text><path d="M360 633 v10" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="650" width="656" height="203" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><rect x="70" y="772" width="60" height="18" rx="3" fill="#17633F" stroke="none" stroke-width="2"/><path d="M 98 774 L 138 731 L 178 762 L 184 794" fill="none" stroke="#17633F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98" cy="774" r="9" fill="white"/><circle cx="98" cy="774" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="138" cy="731" r="9" fill="white"/><circle cx="138" cy="731" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="178" cy="762" r="9" fill="white"/><circle cx="178" cy="762" r="9" fill="none" stroke="#17633F" stroke-width="4"/><path d="M 172 794 v 21 h 8 M 196 794 v 21 h -8" fill="none" stroke="#17633F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="177" y="800" width="16" height="16" rx="3" fill="#BC783D" stroke="none" stroke-width="2"/><path d="M61 825 H270" fill="none" stroke="#D5E5DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="704" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">抓取物体</text><text x="310" y="759" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">控制器调节关节，</text><text x="310" y="802" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">夹爪接触零件。</text><path d="M360 858 v10" fill="none" stroke="#17633F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="32" y="875" width="656" height="203" rx="16" fill="#F2F7F3" stroke="none" stroke-width="2"/><rect x="70" y="1019" width="60" height="18" rx="3" fill="#17633F" stroke="none" stroke-width="2"/><path d="M 98 1021 L 137 966 L 203 978 L 215 1026" fill="none" stroke="#17633F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="98" cy="1021" r="9" fill="white"/><circle cx="98" cy="1021" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="137" cy="966" r="9" fill="white"/><circle cx="137" cy="966" r="9" fill="none" stroke="#17633F" stroke-width="4"/><circle cx="203" cy="978" r="9" fill="white"/><circle cx="203" cy="978" r="9" fill="none" stroke="#17633F" stroke-width="4"/><path d="M 203 1026 v 21 h 8 M 227 1026 v 21 h -8" fill="none" stroke="#17633F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="208" y="1031" width="16" height="16" rx="3" fill="#BC783D" stroke="none" stroke-width="2"/><path d="M61 1050 H270" fill="none" stroke="#D5E5DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="929" font-size="34" fill="#17633F" font-weight="600" text-anchor="start">检查并放置</text><text x="310" y="984" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">利用位置、接触反馈，</text><text x="310" y="1027" font-size="28" fill="#263A31" font-weight="400" text-anchor="start">继续调整动作。</text><path d="M32 1124 H688" fill="none" stroke="#D5E5DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="1161" font-size="24" fill="#557366" font-weight="400" text-anchor="start">动作示意，非型号实拍；具体传感器因任务而异。</text></g></svg>