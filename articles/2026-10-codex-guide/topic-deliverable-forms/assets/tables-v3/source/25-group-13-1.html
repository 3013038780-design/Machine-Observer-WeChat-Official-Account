ne-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个桌面收纳架模型，保留模型和贴图，说明能在哪些工具中打开。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">可旋转三维展示</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在浏览器或应用中转动、缩放模型</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个收纳架的浏览器三维展示，能转动缩放，并保留后续改尺寸的源工程。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">可编辑空间场景</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在三维软件里移动物件、换视角</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">按这些尺寸做一个会场场景，桌椅可调整，能从多个相机角度查看。</td></tr></tbody></table></section></body></html>
