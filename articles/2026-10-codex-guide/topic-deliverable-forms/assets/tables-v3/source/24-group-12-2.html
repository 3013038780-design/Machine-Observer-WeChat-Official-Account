ine-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个按数据生成趋势动画的程序，保留参数、样例和可播放结果。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">分镜、字幕与时间轴</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">按镜头制作，或导入剪辑工具</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">为这段演示写分镜和旁白，配对应字幕时间轴，标清每个镜头展示什么。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">音乐、音效与音乐事件文件</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">播放音频，或用音源演奏 MIDI</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">为这个小游戏做一段循环配乐，交付音频；需要改音符时另留 MIDI 和音源说明。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">可编辑二维动画</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在动画工具中改图层、关键帧和时间</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个小角色的二维待机动画，保留分层工程和播放版，方便以后改动作。</td></tr></tbody></table></section></body></html>
