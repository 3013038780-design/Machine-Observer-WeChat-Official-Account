<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:white;width:360px}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.sheet{width:360px}</style></head><body><section class="sheet"><table style="border-collapse:collapse;table-layout:fixed;width:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;"><colgroup><col style="width:25%"><col style="width:28%"><col style="width:47%"></colgroup><tbody><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">工单处理 Agent</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在工作台接工单，检索并处理</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个工单助手，能查政策和订单、提出处理方案，并记录执行结果。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">桌面操作 Agent</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在获准操作的应用中推进任务</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个桌面任务助手，能根据屏幕反馈整理指定文件，保留操作记录。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">持续任务 Agent 服务</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">网页或接口提交任务，查询状态和结果</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个 Agent 任务后台，能接收、暂停和恢复任务，提供状态查询入口。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">多 Agent 协作系统</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">提交任务后，由多个职责单元分工</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">搭一个分工协作的研究系统，能分配子任务、汇总来源并展示各项状态。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">平台角色助手与配置</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在平台选择角色后对话、使用资料</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">配置一个课程答疑助手，按指定资料和回答规则工作，并交付可复用配置。</td></tr></tbody></table></section></body></html>
