-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个照片批处理工具，按规则改名并生成缩略图，原图保留。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">数据清洗与导入流水线</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">放入新数据，校验整理后写入目标</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个订单清洗程序，统一字段、去重，再导入目标表，输出问题清单。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">定时报告流程</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在设定时间生成报告并查看状态</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一套每周汇总订单的流程，说明运行位置、输出位置和失败记录。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">事件触发流程</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">新文件或记录到达后开始处理</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个新文件处理流程，发现指定目录有表格就校验，再保存结果。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">跨系统同步流程</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在两个系统之间按规则更新记录</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做一个把系统 A 新订单同步到系统 B 的流程，明确字段和重复处理规则。</td></tr></tbody></table></section></body></html>
