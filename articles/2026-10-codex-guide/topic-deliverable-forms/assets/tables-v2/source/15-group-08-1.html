</style></head><body><section class="sheet"><p class="label">08 · 知识库、搜索与 AI 能力包（1/2）</p><table><colgroup><col style="width:25%"><col style="width:28%"><col style="width:47%"></colgroup><thead><tr><th>交付物</th><th>用途 / 入口</th><th>这样跟 AI 说</th></tr></thead><tbody><tr><td class="name">整理好的资料库</td><td>在文件夹或文档平台按主题找资料</td><td class="request">把这些资料按主题整理，保留原文、来源和索引，说明目录怎么使用。</td></tr><tr><td class="name">可搜索知识站</td><td>浏览器里搜关键词，进入对应资料</td><td class="request">把这些笔记做成能搜索的知识站，结果能回到原文，并留下更新方法。</td></tr><tr><td class="name">语义检索库/服务</td><td>按问题含义查相关片段和来源</td><td class="request">做一个资料语义检索工具，输入问题返回相关片段及出处，先选运行方式。</td></tr><tr><td class="name">带出处的资料问答系统</td><td>提问后查看答案与支持材料</td><td class="request">用这些资料做一个问答系统，回答附原文出处，缺依据时明确说明。</td></tr></tbody></table></section></body></html>
