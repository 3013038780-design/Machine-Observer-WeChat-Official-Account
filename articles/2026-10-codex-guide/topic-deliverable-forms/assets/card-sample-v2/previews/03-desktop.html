<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:334px;margin:0;padding:0;background:#F4F7F5}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#263F32;-webkit-font-smoothing:antialiased}.frame{width:334px;height:194px;border:1px solid #D7E5DC;border-radius:6px;overflow:hidden;background:white}.label{height:17px;line-height:17px;text-align:right;padding:0 7px;font-size:10px;color:#728378;background:#FAFCFA;border-top:1px solid #E3ECE6}.screen{height:175px;overflow:hidden}.bar{height:19px;background:#EEF3EF;border-bottom:1px solid #DFE8E1;display:flex;align-items:center;padding:0 7px;gap:4px}.dot{width:4px;height:4px;border-radius:50%;background:#A8BCAF}.windowtitle{font-size:10px;margin-left:6px;color:#64766B}.tick{display:inline-block;background:#17633F;border-radius:3px;color:white;font-size:11px;width:15px;height:15px;line-height:15px;text-align:center;vertical-align:middle}.off{background:white;border:1px solid #B9CDC0;color:white}.btn{background:#17633F;color:white;padding:4px 9px;border-radius:4px;font-size:11px}.muted{color:#718176}.pill{border:1px solid #C7DDCF;border-radius:12px;padding:2px 7px;font-size:10px;background:#F2F7F3}</style><body><section class="frame"><div class="screen"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="windowtitle">图片整理工具</span></div><div style="display:flex;height:156px"><div style="width:62px;background:#F6F8F6;padding:9px 6px;border-right:1px solid #E1EAE3"><div style="font-size:10px;color:#7F8E84;margin-bottom:7px">文件夹</div><div style="font-size:11px;background:#E4EFE7;border-radius:3px;padding:5px 3px;color:#17633F">露营</div><div style="font-size:10px;color:#849288;padding:7px 3px">桌面</div></div><div style="padding:7px 9px;flex:1"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">改名前先预览</b><span style="font-size:10px;color:#6A7B6F">3 张图
