<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:360px;margin:0;padding:0;background:white}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}</style><body><section data-card="20" data-group="4" style="box-sizing:border-box;margin:0 0 14px;padding:12px 12px 13px;background:#fff;border:1px solid #C7DDCF;border-radius:9px;overflow-wrap:anywhere;"><p style="margin:0 0 8px;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:0;color:#17633F;"><span style="font-size:13px;font-weight:500;color:#739383;">20</span>　能继续接任务的助手（Agent）</p><section style="border-top:1px solid #E2EBE5;padding-top:1px;"><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">能做什么 · 在哪里用</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">例如自己电脑上的 Python 研究助手：输入新问题，它能检索、补查并保存结果。研究之外，也可面向编程修复、数据分析、工单处理或浏览器/桌面操作；模型、工具和权限按任务另配。</p><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">交付内容</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">交运行程序、工具连接、依赖、配置样例和打开方法；若有网页入口，说明页面和执行程序各在哪里。</p><section style="margin:11px 0 0;padding:9px 10px;background:#F2F7F3;border-radius:4px;"><p style="margin:0 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">这样跟 AI 说</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#244C36;text-align:left;overflow-wrap:anywhere;">做一个在我电脑上运行的研究助手，能接新问题并补查来源，交程序、打开方法和模型连接说明。</p></section></section></section></body></html>
