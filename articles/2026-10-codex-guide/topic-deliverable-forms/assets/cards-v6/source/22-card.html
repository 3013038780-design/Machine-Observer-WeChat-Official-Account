<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:360px;margin:0;padding:0;background:white}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}</style><body><section data-card="22" data-group="4" style="box-sizing:border-box;margin:0 0 14px;padding:12px 12px 13px;background:#fff;border:1px solid #C7DDCF;border-radius:9px;overflow-wrap:anywhere;"><p style="margin:0 0 8px;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:0;color:#17633F;"><span style="font-size:13px;font-weight:500;color:#739383;">22</span>　AI 技能包（Skill）</p><section style="border-top:1px solid #E2EBE5;padding-top:1px;"><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">能做什么 · 在哪里用</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">让兼容的 AI 助手以后能重复使用的一套做事方法。例如报告制作技能包，包含任务说明，可附脚本、模板和样例。</p><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">交付内容</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">交完整文件包，并说明装进哪个助手、怎样调用。SKILL.md 只是包内那份说明文件的名字。</p><section style="margin:11px 0 0;padding:9px 10px;background:#F2F7F3;border-radius:4px;"><p style="margin:0 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">这样跟 AI 说</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#244C36;text-align:left;overflow-wrap:anywhere;">把这套报告做法整理成可复用的 AI 技能包，带模板和需要的脚本，说明给哪个助手用、怎么安装和调用。</p></section></section></section></body></html>
