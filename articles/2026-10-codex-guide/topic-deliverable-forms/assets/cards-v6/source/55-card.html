<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:360px;margin:0;padding:0;background:white}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}</style><body><section data-card="55" data-group="9" style="box-sizing:border-box;margin:0 0 14px;padding:12px 12px 13px;background:#fff;border:1px solid #C7DDCF;border-radius:9px;overflow-wrap:anywhere;"><p style="margin:0 0 8px;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:0;color:#17633F;"><span style="font-size:13px;font-weight:500;color:#739383;">55</span>　仿真与计算工程</p><section style="border-top:1px solid #E2EBE5;padding-top:1px;"><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">能做什么 · 在哪里用</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">模型、假设、参数、输入与运行方法；改条件重跑并比较。例：运动仿真、实验分析、符号与数值计算。机器人障碍物仿真、实验分析和符号计算也可作为具体任务，交相应模型与运行方法。</p><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">交付内容</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">例如 Python/SciPy 计算程序、参数配置、输入 CSV、依赖与结果；特定仿真器则交其原生工程。</p><section style="margin:11px 0 0;padding:9px 10px;background:#F2F7F3;border-radius:4px;"><p style="margin:0 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">这样跟 AI 说</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#244C36;text-align:left;overflow-wrap:anywhere;">按这些条件建一个可重跑的仿真工程，保留模型、参数、结果与验证范围。</p></section></section></section></body></html>
