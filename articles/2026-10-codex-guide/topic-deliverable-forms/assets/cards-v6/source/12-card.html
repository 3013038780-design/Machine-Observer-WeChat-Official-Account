<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{width:360px;margin:0;padding:0;background:white}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}</style><body><section data-card="12" data-group="2" style="box-sizing:border-box;margin:0 0 14px;padding:12px 12px 13px;background:#fff;border:1px solid #C7DDCF;border-radius:9px;overflow-wrap:anywhere;"><p style="margin:0 0 8px;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:0;color:#17633F;"><span style="font-size:13px;font-weight:500;color:#739383;">12</span>　桌面小组件与系统扩展</p><section style="border-top:1px solid #E2EBE5;padding-top:1px;"><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">能做什么 · 在哪里用</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">从设备桌面卡片或系统入口使用，例如 iPhone 日程小组件、电脑文件右键动作。</p><p style="margin:10px 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">交付内容</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#333;text-align:left;overflow-wrap:anywhere;">iPhone 可交 WidgetKit/Xcode 扩展工程；Windows/macOS 按目标系统的扩展机制交付。</p><section style="margin:11px 0 0;padding:9px 10px;background:#F2F7F3;border-radius:4px;"><p style="margin:0 0 4px;font-size:13px;line-height:1.5;letter-spacing:0;color:#587767;font-weight:600;">这样跟 AI 说</p><p style="margin:0;font-size:16px;line-height:1.65;letter-spacing:0;color:#244C36;text-align:left;overflow-wrap:anywhere;">做一个 iPhone 日程小组件，交 WidgetKit/Xcode 工程，说明系统要求和测试方法。</p></section></section></section></body></html>
