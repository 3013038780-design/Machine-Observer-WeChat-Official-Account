<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:white;width:360px}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.sheet{width:360px}</style></head><body><section class="sheet"><table style="border-collapse:collapse;table-layout:fixed;width:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;"><colgroup><col style="width:23%"><col style="width:42%"><col style="width:35%"></colgroup><thead><tr><th style="font-size:14px;font-weight:500;line-height:1.45;letter-spacing:0;color:#61746A;text-align:left;vertical-align:middle;padding:9px 6px;border:0;border-bottom:2px solid #287A51;background:#FFFFFF;">交付物</th><th style="font-size:14px;font-weight:500;line-height:1.45;letter-spacing:0;color:#61746A;text-align:left;vertical-align:middle;padding:9px 6px;border:0;border-bottom:2px solid #287A51;background:#FFFFFF;">成果与用法</th><th style="font-size:14px;font-weight:500;line-height:1.45;letter-spacing:0;color:#61746A;text-align:left;vertical-align:middle;padding:9px 6px;border:0;border-bottom:2px solid #287A51;background:#FFFFFF;">这样跟 AI 说</th></tr></thead><tbody><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">三维模型</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">例如 Blender .blend 源文件、GLB 交换模型和贴图目录。模型、材质或贴图及使用说明；在查看器、制作工具或游戏项目中打开和导入。例：收纳架、角色、道具。</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做收纳架三维模型，交模型与材质，说明能在哪些工具打开。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">三维场景与动画</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">例如含场景、相机、绑定或动画的 .blend 及 textures/ 素材目录。可继续编辑的场景、对象关系、灯光、相机或绑定动作；例：会场场景、角色动画。</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做会场三维场景，桌椅和相机可调整，保留完整源工程。</td></tr></tbody></table></section></body></html>
