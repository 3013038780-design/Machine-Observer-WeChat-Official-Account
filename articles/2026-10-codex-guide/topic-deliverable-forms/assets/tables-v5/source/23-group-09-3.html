<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:white;width:360px}body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.sheet{width:360px}</style></head><body><section class="sheet"><table style="border-collapse:collapse;table-layout:fixed;width:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;"><colgroup><col style="width:23%"><col style="width:42%"><col style="width:35%"></colgroup><tbody><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">切割与加工资料</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">例如 FreeCAD 等软件的 CAD/CAM 工程、按任务导出的 DXF 图纸和经说明的设备刀路资料。图纸、CAM 工程及约定设备适用的加工资料；例：板材切割、零件加工准备。</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">按指定设备研究板材切割方案，交图纸、加工工程和检查说明。</td></tr><tr><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#17633F;background:#FFFFFF;font-weight:600;">电路与电路板设计</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#333;background:#FFFFFF;font-weight:400;">在KiCad中打开和修改。例如 .kicad_pro、.kicad_sch、.kicad_pcb、所需库和物料清单。原理图、板图、元件资料和检查结果；在电子设计软件中修改、检查和导出。</td><td style="font-size:16px;line-height:1.45;letter-spacing:0;text-align:left;vertical-align:top;padding:9px 6px;border:0;border-bottom:1px solid #DCE8E0;word-break:normal;overflow-wrap:anywhere;line-break:strict;color:#244C36;background:#F2F7F3;font-weight:400;">做指定功能的电路与 PCB 工程，附物料清单、依赖元件和检查结果。</td></tr></tbody></table></section></body></html>
