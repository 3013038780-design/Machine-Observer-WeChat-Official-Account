</style></head><body><section class="sheet"><p class="label">07 · 接口服务与软件复用（1/2）</p><table><colgroup><col style="width:25%"><col style="width:28%"><col style="width:47%"></colgroup><thead><tr><th>交付物</th><th>用途 / 入口</th><th>这样跟 AI 说</th></tr></thead><tbody><tr><td class="name">查询服务</td><td>网页、App 等传编号，取得数据</td><td class="request">做一个库存查询 API，输入商品号返回数量和更新时间，附调用示例。</td></tr><tr><td class="name">规则计算服务</td><td>其他程序传参数，取得计算明细</td><td class="request">做一个运费计算 API，输入重量和目的地返回明细，附规则和启动方法。</td></tr><tr><td class="name">文件处理服务</td><td>上传文件，直接或按任务编号取结果</td><td class="request">做一个表格转换服务，上传文件后返回约定格式，说明失败时怎样反馈。</td></tr><tr><td class="name">业务操作服务</td><td>应用提交业务请求，收到处理结果</td><td class="request">做一个预约登记 API，提交时段后保存记录，已满时返回明确原因。</td></tr></tbody></table></section></body></html>
